path: /mnt/d/BRACU_Projects/KIBO_6th/rpc6YoloV8n/datasets/yolo_data

train: images/train
val: images/val
test: images/test

nc: 11
names: ['coin','compass','coral','crystal','diamond','emerald','fossil','key','letter','shell','treasure_box']


scales:

  n: [0.33, 0.25, 1024] 

backbone:
  - [-1, 1, Conv, [64, 3, 2]]        
  - [-1, 1, Conv, [128, 3, 2]]     
  - [-1, 3, C2f, [128, True]]      
  - [-1, 1, Conv, [256, 3, 2]]      
  - [-1, 6, C2f, [256, True]]         
  - [-1, 1, Conv, [512, 3, 2]]       
  - [-1, 9, C2f, [512, True]]   #6 to 9, which gives the model more capacity to extract mid-level features, useful for understanding overlapping or cluttered objects.
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 4, C2f, [1024, True]]    #3 to 4, which increases deep feature extraction for faded or complex patterns, helping in cases where object edges aren’t well-defined.
  - [-1, 1, SPPF, [1024, 5]]    


head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 4, C2f, [512]]          # Deeper: 3 to 4, which adds more context & refinement before detection

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 4, C2f, [256]]          # Deeper: 3 to 4, which adds more context & refinement before detection

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 12], 1, Concat, [1]]
  - [-1, 4, C2f, [512]]          # Deeper: 3 to 4, which adds more context & refinement before detection

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 9], 1, Concat, [1]]
  - [-1, 4, C2f, [1024]]         # Deeper: 3 to 4, which adds more context & refinement before detection

  - [[3, 15, 18, 21], 1, Detect, [nc]]
